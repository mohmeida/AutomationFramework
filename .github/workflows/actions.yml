name: Regression Workflow

on:
  workflow_dispatch:  # ✅ Only runs manually

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    # ✅ Only run this job if the branch is master
    if: github.ref == 'refs/heads/master'  

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Build the project with Gradle
      - name: Build with Gradle
        run: ./gradlew clean build

      # Run the tests with detailed logs
      - name: Run tests
        run: ./gradlew clean test --info
        continue-on-error: true  

      # Upload screenshots (if tests fail)
      - name: Upload screenshots (if any)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots

      # Upload Cucumber test reports
      - name: Upload Cucumber Reports
        uses: actions/upload-artifact@v4
        with:
           name: cucumber-reports
           path: target/*

      # Deploy Cucumber report to GitHub Pages
      - name: Deploy to GitHub Pages
        if: success()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target
          publish_branch: gh-pages

      # Post a refresh link to the PR or Actions page
      - name: Post Refresh Link
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const runId = context.runId;
            const repo = context.repo.repo;
            const owner = context.repo.owner;
            const url = `https://github.com/${owner}/${repo}/actions/runs/${runId}`;
            console.log(`🔄 Click here to refresh: ${url}`);
