# .github/workflows/regression.yml
name: Regression Workflow  

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'  # daily at 5 AM UTC

permissions:
  actions: read
  contents: write
  pull-requests: write
  pages: write        # needed to publish to GitHub Pages
  id-token: write     # needed by deploy-pages action

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code (Ensure latest commit)
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Clear Gradle Cache (Prevent stale builds)
        run: rm -rf ~/.gradle/caches

      - name: Build with Gradle
        run: ./gradlew clean build --no-daemon

      - name: Run tests
        id: run-tests
        run: |
          set +e
          ./gradlew clean test --info --fail-fast --no-build-cache --rerun-tasks
          TEST_EXIT_CODE=$?
          echo "TESTS_FAILED=$TEST_EXIT_CODE" >> $GITHUB_ENV
          exit $TEST_EXIT_CODE

      - name: Upload Cucumber Reports (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: target/cucumber-report.html

      - name: Upload raw Cucumber Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report-view
          path: cucumber-reports/index.html
          retention-days: 7

      # Publish the HTML folder to GitHub Pages
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: cucumber-reports     # folder containing index.html + assets
          name: github-pages
          retention-days: 7       # keep Pages artifact for 7 days

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
