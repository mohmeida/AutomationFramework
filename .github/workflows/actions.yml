name: Regression Workflow

on:
  workflow_dispatch:  # ✅ Allows manual trigger
  schedule:
    - cron: '0 6 * * *'  # ✅ Runs at 6 AM UTC daily

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    # ✅ Ensure this job only runs on master branch
    if: github.ref == 'refs/heads/master'  

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ✅ Cache Gradle dependencies (Improves speed)
      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ✅ Build the project with Gradle
      - name: Build with Gradle
        run: ./gradlew clean build --no-daemon

      # ✅ Run the tests & fail on first failure
      - name: Run tests
        run: |
          ./gradlew clean test --fail-fast --info
          if [ $? -ne 0 ]; then
            echo "❌ Tests failed! Failing the build
