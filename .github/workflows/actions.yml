name: Regression Workflow

on:
  workflow_dispatch:  # ✅ Allows manual trigger
  schedule:
    - cron: '0 6 * * *'  # ✅ Runs at 6 AM UTC daily

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/master'  

    steps:
      - name: Checkout code (Ensure latest commit)
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # ✅ Ensure full history is pulled

      # ✅ Debug: Confirm correct branch and latest commit
      - name: Verify branch and latest commit
        run: |
          git branch
          git log -1
          git status

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Clear Gradle Cache (Prevent stale builds)
        run: rm -rf ~/.gradle/caches

      - name: Build with Gradle
        run: ./gradlew clean build --no-daemon

      - name: Run tests (Capture failure)
        run: |
          ./gradlew clean test --info || echo "TESTS_FAILED=true" >> $GITHUB_ENV

      - name: Upload Cucumber Reports (Always run)
        if: always()
        uses: actions/upload-artifact@v4
        with:
           name: cucumber-reports
           path: target/*

      - name: Fail workflow if tests failed
        if: env.TESTS_FAILED == 'true'
        run: exit 1
