name: Regression Workflow

on:
  workflow_dispatch:  # ✅ Allows manual trigger
  schedule:
    - cron: '0 6 * * *'  # ✅ Runs at 6 AM UTC daily

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/master'  

    steps:
      - name: Checkout code (Ensure latest commit)
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # ✅ Ensure full history is pulled

      - name: Verify branch and latest commit
        run: |
          git fetch origin master
          git checkout master
          git pull origin master
          git branch
          git log -1
          git status

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Clear Gradle Cache (Prevent stale builds)
        run: rm -rf ~/.gradle/caches

      - name: Build with Gradle
        run: ./gradlew clean build --no-daemon

      - name: Run tests
        id: run-tests  # ✅ Assign an ID to reference later
        run: |
          ./gradlew clean test --info --fail-fast --no-build-cache --rerun-tasks || echo "TESTS_FAILED=true" >> $GITHUB_ENV
        continue-on-error: true  # ✅ Allow workflow to continue

      - name: Debug test failure flag
        run: echo "TESTS_FAILED is set to $TESTS_FAILED"

      - name: Publish Cucumber Report to GitHub Pages
        if: always()
        run: |
          mkdir -p cucumber-reports
          cp target/cucumber-report.html cucumber-reports/index.html
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"
          git fetch origin gh-pages || git checkout --orphan gh-pages
          git checkout gh-pages
          mv cucumber-reports/* .
          git add index.html
          git commit -m "Update Cucumber Report"
          git push origin gh-pages --force

      - name: Provide Cucumber Report URL
        run: echo "Report is available at: https://your-username.github.io/your-repo/"  # ✅ Replace with actual repo URL

      - name: Fail workflow if tests failed
        if: env.TESTS_FAILED == 'true'
        run: exit 1
