name: Regression Workflow

on:
  workflow_dispatch:  # ✅ Allows manual trigger
  schedule:
    - cron: '0 6 * * *'  # ✅ Runs at 6 AM UTC daily

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/master'  

    steps:
      - name: Checkout code (Ensure latest commit)
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # ✅ Ensure full history is pulled

      - name: Verify branch and latest commit
        run: |
          git branch
          git log -1
          git status

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Clear Gradle Cache (Prevent stale builds)
        run: rm -rf ~/.gradle/caches

      - name: Build with Gradle
        run: ./gradlew clean build --no-daemon

      - name: Run tests
        id: run-tests
        run: |
          ./gradlew clean test --info --fail-fast --no-build-cache --rerun-tasks || echo "TESTS_FAILED=true" > test_status.txt
        continue-on-error: true  # ✅ Allow workflow to continue

      - name: Capture test failure status
        run: |
          if [ -f test_status.txt ]; then
            echo "TESTS_FAILED=true" >> $GITHUB_ENV
          fi

      - name: Upload Cucumber Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: target/cucumber-report.html  # ✅ Ensure this path is correct

      - name: Fail workflow if tests failed
        run:
