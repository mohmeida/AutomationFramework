name: Regression Workflow  # ✅ Name remains unchanged

on:
  workflow_dispatch:  # ✅ Allows manual trigger
  schedule:
    - cron: '0 6 * * *'  # ✅ Runs at 6 AM UTC daily

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/master'  

    steps:
      - name: Checkout code (Ensure latest commit)
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # ✅ Ensure full history is pulled

      - name: Verify branch and latest commit
        run: |
          git fetch origin master
          git checkout master
          git pull origin master
          git branch
          git log -1
          git status

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Clear Gradle Cache (Prevent stale builds)
        run: rm -rf ~/.gradle/caches

      - name: Build with Gradle
        run: ./gradlew clean build --no-daemon

      - name: Run tests
        id: run-tests  # ✅ Assign an ID to reference later
        run: |
          ./gradlew clean test --info --fail-fast --no-build-cache --rerun-tasks || echo "TESTS_FAILED=true" >> $GITHUB_ENV
        continue-on-error: true  # ✅ Allow workflow to continue

      - name: Debug test failure flag
        run: echo "TESTS_FAILED is set to $TESTS_FAILED"

      # ✅ Upload the Cucumber HTML Report
      - name: Upload Cucumber Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: target/cucumber-report.html  # ✅ Ensure this path is correct

      # ✅ Generate Public URL for Cucumber Report (GitHub Pages Alternative)
      - name: Make Cucumber Report Accessible
        if: always()
        run: |
          mkdir -p cucumber-reports
          cp target/cucumber-report.html cucumber-reports/index.html
        # Upload it to a raw file viewable without downloading
      - name: Upload Cucumber Report as Raw HTML
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report-view
          path: cucumber-reports/index.html
          retention-days: 7  # Keep for 7 days

      # ✅ Output Cucumber Report Link
      - name: Show Cucumber Report Link
        run: echo 'Cucumber Report: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts'

      - name: Fail workflow if tests failed
        if: env.TESTS_FAILED == 'true'
        run: exit 1
