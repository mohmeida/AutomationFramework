plugins {
    id("java")
}

group = "org.example"
version = "1.0-SNAPSHOT"

repositories {
    mavenCentral()
}

dependencies {
    testImplementation(platform("org.junit:junit-bom:5.10.0"))
    testImplementation("org.junit.jupiter:junit-jupiter")

    // Use TestNG framework
    testImplementation("io.cucumber:cucumber-java:7.6.0")
    testImplementation("io.cucumber:cucumber-testng:7.6.0")
    testImplementation("org.testng:testng:7.6.0")

    // Others
    implementation("com.google.guava:guava:31.0.1-jre")
    implementation("org.seleniumhq.selenium:selenium-java:4.18.1")
    implementation("org.seleniumhq.selenium:selenium-chrome-driver:4.18.1")
    implementation("io.github.bonigarcia:webdrivermanager:5.9.2")

    // Add RestAssured for API testing
    testImplementation("io.rest-assured:rest-assured:5.3.0")

    // JSON Path and XML Path support
    testImplementation("io.rest-assured:json-path:5.3.0")
    testImplementation("io.rest-assured:xml-path:5.3.0")

    // AssertJ Core for assertions
    testImplementation 'org.assertj:assertj-core:3.24.2'
}

tasks.test {
    // Use TestNG for unit tests.
    useTestNG()
}

// Define a new resolvable configuration
configurations {
    resolvableTestImplementation {
        extendsFrom testImplementation
        canBeResolved = true
    }
}

tasks.register('runCucumber', JavaExec) {
    dependsOn assemble, testClasses
    main = 'io.cucumber.core.cli.Main'
    classpath = configurations.resolvableTestImplementation + sourceSets.main.output + sourceSets.test.output
    args = [
            '--plugin', 'pretty',
            '--plugin', 'html:target/cucumber-report.html',
            '--plugin', 'json:target/cucumber.json',
            '--plugin', 'junit:target/cucumber.xml',
            '--glue', 'co.system.cucumber.glue',
            '--tags', '@Run',
            'src/test/resources/cucumber/features'
    ]

    // Ensure test failures stop the process
    ignoreExitValue = false  // ✅ This ensures Gradle exits with an error if tests fail

    environment 'QA_ENV', System.getenv("QA_ENV") ?: 'default'
}